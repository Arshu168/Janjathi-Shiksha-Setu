services:
  # 1. Mobile Web Application (Expo React Native Web)
  - type: web
    name: janjathi-shiksha-setu-mobile
    env: static
    autoDeploy: true
    rootDir: apps/mobile
    buildCommand: npm install --include=dev && npx expo export -p web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Admin Mission Control Portal
  - type: web
    name: janjathi-shiksha-setu-admin
    env: static
    autoDeploy: true
    rootDir: apps/admin
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. Backend Fastify API Service
  - type: web
    name: janjathi-shiksha-setu-api
    env: node
    plan: free
    autoDeploy: true
    rootDir: services/api
    buildCommand: npm install --include=dev && npx prisma db push && npm run db:seed && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
